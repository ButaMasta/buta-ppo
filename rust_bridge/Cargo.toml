[package]
name = "rust_bridge"
version = "0.1.0"
edition = "2024"

# The RLBot bot binary is its own package, so building the bridge for training never builds the bot or its C++
# library. `cargo build` here builds only the bridge; `cargo build -p buta_ppo_bot` builds the bot.
[workspace]
members = [".", "bot"]
default-members = ["."]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Exact versions: the shipped Nexto ladder (src/external/nexto/nexto_ladder.txt) is calibrated for this physics, so a
# RocketSim update means recalibrating it. ball_sim's rev is the one synced with this RocketSim.
rocketsim = "=0.3.3"
rocketsim_vis = "=0.3.3"
ball_sim = { git = "https://github.com/VirxEC/rocketsim-utils.git", rev = "90df2bc795545d1c458ce0b67398ebdb56a2ab3b" }
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
