[package]
name = "rust_bridge"
version = "0.1.0"
edition = "2024"

# The RLBot bot binary is its own package, so building the bridge for training never builds the bot or its C++
# library. `cargo build` here builds only the bridge; `cargo build -p buta_ppo_bot` builds the bot.
[workspace]
members = [".", "bot"]
default-members = ["."]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rocketsim = "0.2.11"
rocketsim_vis = "0.2.11"
ball_sim = { git = "https://github.com/VirxEC/rocketsim-utils.git", rev = "88279c9f3b6f431dc2f342947e1f5b32db8f0254" }
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
