[package]
name = "rust_bridge"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
cmake = "0.1"

[dependencies]
rocketsim = "0.2.11"
rocketsim_vis = "0.2.11"
ball_sim = { git = "https://github.com/VirxEC/rocketsim-utils.git", rev = "88279c9f3b6f431dc2f342947e1f5b32db8f0254" }
rlbot-rocketsim = "0.1.0"
libc = "0.2"

[[bin]]
name = "buta_ppo_bot"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
