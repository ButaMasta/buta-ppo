#:schema https://rlbot.org/schemas/agent.json
# Fields marked TEMPLATE are example values from the original bot. Change them for your own bot.

[settings]
# TEMPLATE: A unique identifier for your bot. Recommended format is "developer/botname".
agent_id = "PigMasta/Porkchop"
# TEMPLATE: The name displayed in game.
name = "Porkchop"
# Path to the loadout config, relative to this file.
loadout_file = "loadout.toml"
# The command RLBot runs to start the bot. The bot binary finds its libraries in libs/ next to it.
# It runs model.pt in this directory. To run another model, add its path to both run commands, e.g.
# "./buta_ppo_bot models/old.pt". Copies of this file with their own agent_id, name and model put several versions
# in the RLBot GUI.
run_command = "./buta_ppo_bot"
# The command RLBot runs to start the bot on Linux.
run_command_linux = "./buta_ppo_bot"
# TEMPLATE: Path to the bot's logo, displayed in the GUI. Not included in the repository, so add your own
# image here or remove this line.
logo_file = "icon.png"
hivemind = false

# Optional metadata for helper programs.
[details]
# TEMPLATE: Short description of the bot.
description = "A MLP PPO Rocket League Bot"
# TEMPLATE: Fun fact about the bot.
fun_fact = "Made with buta-ppo, the best framework"
# TEMPLATE: Name of the bot's creator.
developer = "The RLBot community"
# Programming language.
language = "C++ and a tiny bit of Rust"
# ALL POSSIBLE TAGS: 1v1, teamplay, goalie, hoops, dropshot, snow-day, rumble, spike-rush, heatseeker, memebot
# NOTE: Only add the goalie tag if your bot only plays as a goalie; this directly contrasts with the teamplay tag!
# NOTE: Only add a tag for a special game mode if your bot properly supports it.
tags = []
